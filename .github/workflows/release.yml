name: WLED Release CI

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  
  wled_build:
    uses: ./.github/workflows/build.yml
    with:
      release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: wled_build
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true
    - name: Publier la version
      uses: softprops/action-gh-release@v2
      with:
        name: WLED ${{ github.ref_name }} (français)
        body: |
          WLED 16.0.1 avec l'interface traduite en français.

          Carte SMLIGHT A1-SLWF-03 (ESP32, micro audio-réactif) : utilisez **WLED_16.0.1_ESP32.bin**.
          Installation : dans WLED, Config → Sécurité et mises à jour → Mettre à jour WLED, puis envoyez le fichier .bin.
        draft: false
        files: |
          *.bin
          *.bin.gz
